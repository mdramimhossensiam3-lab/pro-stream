<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CyberStream - Pro TV Hub</title>
  
  <style>
    :root{
      --bg: #0a0e17;
      --card-bg: #131b2e;
      --neon: #00ffcc;
      --neon-glow: rgba(0, 255, 204, 0.3);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* Top Navbar */
    .top-header {
      background: rgba(19, 27, 46, 0.9);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      color: var(--neon);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* Video Player Box */
    .player-card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 204, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .video-container {
      width: 100%;
      height: 480px;
      background: #000;
      position: relative;
    }
    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .player-info {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.2);
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .now-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--neon);
    }
    .live-tag {
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* Channel Sections */
    .section-title {
      font-size: 16px;
      color: var(--muted);
      margin: 25px 0 12px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-left: 4px solid var(--neon);
      padding-left: 8px;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .channel-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.2s ease;
    }
    .channel-card:hover {
      border-color: var(--neon);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px var(--neon-glow);
    }
    .channel-card img {
      width: 100%;
      height: 70px;
      object-fit: contain;
      margin-bottom: 8px;
      background: #000;
      border-radius: 6px;
    }
    .channel-card span {
      font-size: 12px;
      font-weight: 600;
      display: block;
      color: var(--text);
    }

    /* Bottom Navigation Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 19, 33, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }
    .nav-item {
      color: var(--muted);
      text-align: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: 0.2s;
    }
    .nav-item.active {
      color: var(--neon);
      text-shadow: 0 0 10px var(--neon-glow);
    }
    .nav-item div:first-child {
      font-size: 20px;
      margin-bottom: 3px;
    }

    @media(max-width: 768px) {
      .video-container { height: 260px; }
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="logo">⚡ CyberStream Hub</div>
  </div>

  <div class="container">
    <div class="player-card">
      <div class="video-container" id="playerBox">
        <video id="videoPlayer" controls playsinline></video>
      </div>
      <div class="player-info">
        <div>
          <div style="font-size: 11px; color: var(--muted);">NOW PLAYING</div>
          <div class="now-title" id="nowPlayingText">Select a Channel</div>
        </div>
        <div class="live-tag">LIVE</div>
      </div>
    </div>

    <div class="section-title">🏆 Sports Channels</div>
    <div class="channels-grid">
      <div class="channel-card" onclick="playHLS('https://37b4c228.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWZyX0ZJRkFQbHVzRnJlbmNoX0hMUw/playlist.m3u8', 'FIFA TV French')">
        <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=150" alt="FIFA">
        <span>FIFA TV French</span>
      </div>
      <div class="channel-card" onclick="playHLS('https://ncdn.telewebion.ir/faratar/live/playlist.m3u8', 'IRIB Sports 4K')">
        <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=150" alt="IRIB">
        <span>IRIB Sports 4K</span>
      </div>
      <div class="channel-card" onclick="playHLS('http://94.130.32.19:8080/sporttv5/index.m3u8', 'Sport TV 5 HD')">
        <img src="https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=150" alt="SportTV">
        <span>Sport TV 5 HD</span>
      </div>
    </div>

    <div class="section-title">🔴 Live TV & News</div>
    <div class="channels-grid">
      <div class="channel-card" onclick="playYouTube('i8VSQO6TlFc', 'Somoy TV Live')">
        <img src="https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=150" alt="Somoy">
        <span>Somoy TV Live</span>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="nav-item active">
      <div>🏠</div>
      <span>Home</span>
    </div>
    <div class="nav-item" onclick="alert('সচল ফ্রি পাবলিক চ্যানেলগুলো এখানে যুক্ত করা হয়েছে!')">
      <div>⚽</div>
      <span>Sports</span>
    </div>
    <div class="nav-item" onclick="alert('লাইভ নিউজ ক্যাটাগরি')">
      <div>📰</div>
      <span>News</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    let hlsInstance = null;
    const playerBox = document.getElementById('playerBox');
    const nowText = document.getElementById('nowPlayingText');

    function playHLS(url, name) {
      if(hlsInstance) { hlsInstance.destroy(); }
      playerBox.innerHTML = '<video id="videoPlayer" controls playsinline></video>';
      const video = document.getElementById('videoPlayer');
      nowText.textContent = name;

      if (Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(()=>{});
      }
    }

    function playYouTube(videoId, name) {
      if(hlsInstance) { hlsInstance.destroy(); }
      nowText.textContent = name;
      playerBox.innerHTML = `
        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                title="YouTube live" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
        </iframe>
      `;
    }

    // Default play
    window.onload = () => {
      playHLS('https://37b4c228.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWZyX0ZJRkFQbHVzRnJlbmNoX0hMUw/playlist.m3u8', 'FIFA TV French');
    };
  </script>
</body>
</html>
