<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live TV - Playlist Hub</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.9);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #050811;
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .main-layout {
            display: flex;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Left Section: Player & Input */
        .left-section {
            flex: 2.5;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .top-bar {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        #player-container {
            width: 100%;
            height: 420px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .custom-input-box {
            display: flex;
            gap: 10px;
        }
        .custom-input-box input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        .custom-input-box button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: var(--accent-color);
            color: #0b0f19;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .custom-input-box button:hover {
            opacity: 0.9;
        }
        /* Right Section: Channels List */
        .right-section {
            flex: 1.2;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            max-height: 520px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            outline: none;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .channels-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1f2937;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .channel-item:hover {
            border-color: var(--accent-color);
            background: #374151;
        }
        .channel-item span {
            font-size: 13px;
            font-weight: 600;
        }
        @media(max-width: 768px) {
            .main-layout { flex-direction: column; }
            #player-container { height: 250px; }
            .right-section { max-height: 350px; }
        }
    </style>
</head>
<body>

<div class="main-layout">
    <!-- Player Panel -->
    <div class="left-section">
        <div class="top-bar" id="current-title">Pro Live TV Hub</div>
        <div id="player-container"></div>
        <div class="custom-input-box">
            <input type="text" id="customUrl" placeholder="আপনার .m3u8 বা স্ট্রিম লিংক এখানে পেস্ট করুন...">
            <button onclick="playCustomStream()">চালু করুন</button>
        </div>
    </div>

    <!-- Channels List Panel -->
    <div class="right-section">
        <input type="text" class="search-box" placeholder="Search Channel..." onkeyup="filterChannels()">
        <div class="channels-list" id="channelList">
            <div class="channel-item" onclick="playStream('https://raw.githubusercontent.com/rajufreedom71/rajuiptv/refs/heads/main/playlist.m3u', 'Raju IPTV Playlist')">
                <span>📺 Raju IPTV Playlist</span>
            </div>
            <div class="channel-item" onclick="playStream('https://raw.githubusercontent.com/abusaeeidx/Mrgify-Tv/refs/heads/main/playlist.m3u', 'Mrgify TV Playlist')">
                <span>⚽ Mrgify TV Playlist</span>
            </div>
            <div class="channel-item" onclick="playStream('https://raw.githubusercontent.com/abusaeeidx/Yupptv-Playlist/refs/heads/main/playlist.m3u', 'YuppTV Playlist')">
                <span>📺 YuppTV Playlist</span>
            </div>
            <div class="channel-item" onclick="playStream('https://raw.githubusercontent.com/abusaeeidx/T-Sports-Playlist-Auto-Update/refs/heads/main/combine_playlist.m3u', 'T Sports Auto Update')">
                <span>🏏 T Sports Playlist</span>
            </div>
            <div class="channel-item" onclick="playStream('https://playlist-share-abux.pages.dev/sun-network.m3u', 'Sun NXT Playlist')">
                <span>🎬 Sun NXT Playlist</span>
            </div>
        </div>
    </div>
</div>

<script>
    let player;

    function playStream(url, title) {
        if (player) {
            player.destroy();
        }
        document.getElementById('current-title').innerText = title;
        player = new Clappr.Player({
            source: url,
            parentId: "#player-container",
            autoPlay: true,
            height: "100%",
            width: "100%",
        });
    }

    function playCustomStream() {
        const url = document.getElementById('customUrl').value.trim();
        if (url) {
            playStream(url, 'Custom Stream');
        } else {
            alert('দয়া করে সঠিক লিংক দিন!');
        }
    }

    function filterChannels() {
        let input = document.querySelector('.search-box').value.toLowerCase();
        let items = document.querySelectorAll('.channel-item');
        items.forEach(item => {
            let text = item.innerText.toLowerCase();
            item.style.display = text.includes(input) ? 'flex' : 'none';
        });
    }

    window.onload = function() {
        playStream('https://raw.githubusercontent.com/rajufreedom71/rajuiptv/refs/heads/main/playlist.m3u', 'Raju IPTV Playlist');
    };
</script>

</body>
</html>
