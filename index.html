<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live TV Hub - Ultra HD</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js CDN for M3U8 Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased selection:bg-red-500 selection:text-white">

    <!-- Navbar -->
    <header class="flex justify-between items-center px-6 py-4 border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-xl sticky top-0 z-50 shadow-lg">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
            <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-rose-400">PRO <span class="text-white">STREAM HUB</span></h1>
        </div>
        <div class="flex items-center space-x-3">
            <span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30 font-medium">● 24/7 ULTRA HD</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 mt-2">
        
        <!-- Video Player Section -->
        <div class="lg:col-span-2 bg-slate-900/80 rounded-2xl overflow-hidden border border-slate-800/80 shadow-2xl flex flex-col backdrop-blur-md">
            <div class="aspect-video bg-black flex items-center justify-center relative shadow-inner">
                <video id="video-player" class="w-full h-full object-contain" controls autoplay playsinline></video>
                <div id="placeholder-text" class="absolute text-slate-400 animate-pulse pointer-events-none text-sm font-medium flex items-center space-x-2">
                    <span>📺 তালিকা থেকে যেকোনো চ্যানেলে ক্লিক করুন...</span>
                </div>
            </div>
            
            <!-- Custom Link Box for adding any extra Bangladeshi Channel -->
            <div class="p-4 bg-slate-950/60 border-t border-slate-800 flex gap-2">
                <input type="text" id="custom-link" placeholder="বা যেকোনো নতুন .m3u8 লিংক এখানে পেস্ট করুন..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-xs focus:outline-none focus:border-red-500 text-slate-200">
                <button onclick="playCustomStream()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-xs font-bold rounded-xl transition-all shadow-lg text-white">চালু করুন</button>
            </div>

            <div class="p-5 bg-gradient-to-t from-slate-950/80 to-transparent flex justify-between items-center">
                <div>
                    <h2 id="channel-title" class="text-xl font-bold text-slate-100">চ্যানেল নির্বাচন করুন</h2>
                    <p id="channel-status" class="text-xs text-slate-400 mt-1">স্ট্যাটাস: প্লে করার জন্য প্রস্তুত</p>
                </div>
                <button onclick="reloadStream()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl border border-slate-700 transition-all text-slate-300">🔄 রিলোড স্ট্রিম</button>
            </div>
        </div>

        <!-- Channel List Sidebar -->
        <div class="bg-slate-900/80 rounded-2xl p-4 border border-slate-800/80 flex flex-col h-[580px] backdrop-blur-md shadow-2xl">
            <div class="mb-4">
                <input type="text" id="search-box" placeholder="🔍 চ্যানেল খুঁজুন..." class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 text-slate-200 placeholder-slate-500 transition-all shadow-inner">
            </div>
            
            <div id="channel-list" class="overflow-y-auto space-y-2 pr-1 flex-1 custom-scrollbar">
                
                <!-- T Sports (Updated BD Sports Stream) -->
                <button onclick="playStream('https://mcdn.tports.com/live/index.m3u8', 'T Sports (Bangladesh)')" class="channel-btn w-full flex items-center justify-between p-3.5 bg-slate-950/50 hover:bg-slate-800/80 border border-slate-800/50 hover:border-red-500/50 rounded-xl transition-all group shadow-sm">
                    <span class="font-medium text-sm text-slate-200 group-hover:text-red-400 flex items-center gap-2">🇧🇩 T Sports HD</span>
                    <span class="text-[10px] bg-red-500/20 text-red-400 px-2.5 py-1 rounded-md font-semibold border border-red-500/30">Live</span>
                </button>

                <!-- Real Madrid TV -->
                <button onclick="playStream('https://rmtv.akamaized.net/hls/live/2043154/rmtv-en-web/master.m3u8', 'Real Madrid TV (English)')" class="channel-btn w-full flex items-center justify-between p-3.5 bg-slate-950/50 hover:bg-slate-800/80 border border-slate-800/50 hover:border-red-500/50 rounded-xl transition-all group shadow-sm">
                    <span class="font-medium text-sm text-slate-200 group-hover:text-red-400 flex items-center gap-2">⚽ Real Madrid TV</span>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-md font-semibold border border-emerald-500/30">1080p</span>
                </button>

                <!-- Willow Sports -->
                <button onclick="playStream('https://d36r8jifhgsk5j.cloudfront.net/Willow_TV.m3u8', 'Willow Sports')" class="channel-btn w-full flex items-center justify-between p-3.5 bg-slate-950/50 hover:bg-slate-800/80 border border-slate-800/50 hover:border-red-500/50 rounded-xl transition-all group shadow-sm">
                    <span class="font-medium text-sm text-slate-200 group-hover:text-red-400 flex items-center gap-2">🏏 Willow Sports</span>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-md font-semibold border border-emerald-500/30">HD</span>
                </button>

                <!-- FIFA World Cup 2026 -->
                <button onclick="playStream('https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/1702-audio_113322_eng=113200-video=2202800.m3u8', 'FIFA World Cup 2026')" class="channel-btn w-full flex items-center justify-between p-3.5 bg-slate-950/50 hover:bg-slate-800/80 border border-slate-800/50 hover:border-red-500/50 rounded-xl transition-all group shadow-sm">
                    <span class="font-medium text-sm text-slate-200 group-hover:text-red-400 flex items-center gap-2">🏆 FIFA World Cup 2026</span>
                    <span class="text-[10px] bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-md font-semibold border border-amber-500/30">Special</span>
                </button>

                <!-- Red Bull TV Brasil -->
                <button onclick="playStream('https://d03ae6b5c6724c24867e97a3dc04934a.mediatailor.us-west-2.amazonaws.com/v1/master/ba62fe743df0fe93366eba3a257d792884136c7f/LINEAR-1026-WORBBRPTFAST-WHALETVPLUS/1026/hls/master/playlist.m3u8', 'Red Bull TV Brasil')" class="channel-btn w-full flex items-center justify-between p-3.5 bg-slate-950/50 hover:bg-slate-800/80 border border-slate-800/50 hover:border-red-500/50 rounded-xl transition-all group shadow-sm">
                    <span class="font-medium text-sm text-slate-200 group-hover:text-red-400 flex items-center gap-2">⚡ Red Bull TV Brasil</span>
                    <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-md font-semibold border border-blue-500/30">HD</span>
                </button>

                <!-- Red Bull TV Australia -->
                <button onclick="playStream('https://db34cc6127ac459db55cab5f97cd66b9.mediatailor.us-west-2.amazonaws.com/v1/master/ba62fe743df0fe93366eba3a257d792884136c7f/LINEAR-680-WORBAUENFAST-WHALETVPLUS/680/whaletvplus/hls/master/playlist.m3u8', 'Red Bull TV Australia')" class="channel-btn w-full flex items-center justify-between p-3.5 bg-slate-950/50 hover:bg-slate-800/80 border border-slate-800/50 hover:border-red-500/50 rounded-xl transition-all group shadow-sm">
                    <span class="font-medium text-sm text-slate-200 group-hover:text-red-400 flex items-center gap-2">⚡ Red Bull TV Australia</span>
                    <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-md font-semibold border border-blue-500/30">HD</span>
                </button>

            </div>
        </div>

    </main>

    <!-- JavaScript for Advanced HLS Streaming & Search -->
    <script>
        const video = document.getElementById('video-player');
        const placeholder = document.getElementById('placeholder-text');
        const channelTitle = document.getElementById('channel-title');
        const channelStatus = document.getElementById('channel-status');
        let hls = null;
        let currentUrl = '';

        function playStream(url, name) {
            currentUrl = url;
            placeholder.style.display = 'none';
            channelTitle.innerText = name;
            channelStatus.innerText = 'সংযোগ স্থাপন করা হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।';

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls({
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false;
                    }
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(err => {
                        console.log("Autoplay prevented:", err);
                    });
                    channelStatus.innerText = 'স্ট্যাটাস: সফলভাবে লাইভ চলছে (Ultra HD)';
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                channelStatus.innerText = 'ত্রুটি: নেটওয়ার্ক বা স্ট্রিম লিংক অফলাইন!';
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                channelStatus.innerText = 'ত্রুটি: মিডিয়া প্লেব্যাক রিকভার করা হচ্ছে...';
                                hls.recoverMediaError();
                                break;
                            default:
                                channelStatus.innerText = 'ত্রুটি: এই স্ট্রিমটি বর্তমানে কাজ করছে না বা ব্রাউজারে ব্লক করা হয়েছে।';
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                    channelStatus.innerText = 'স্ট্যাটাস: সফলভাবে লাইভ চলছে (Ultra HD)';
                });
            }
        }

        function playCustomStream() {
            const customUrl = document.getElementById('custom-link').value.trim();
            if (customUrl) {
                playStream(customUrl, 'Custom Stream (Direct)');
            } else {
                alert('দয়া করে একটি বৈধ .m3u8 লিংক দিন!');
            }
        }

        function reloadStream() {
            if (currentUrl) {
                playStream(currentUrl, channelTitle.innerText);
            }
        }

        // Realtime Search Filter
        document.getElementById('search-box').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => {
                const text = btn.innerText.toLowerCase();
                btn.style.display = text.includes(term) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
