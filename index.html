<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live TV Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js CDN for M3U8 Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-white font-sans">

    <!-- Navbar -->
    <header class="flex justify-between items-center px-6 py-4 border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <h1 class="text-xl font-bold tracking-wider text-red-500">PRO <span class="text-white">STREAM</span></h1>
        <span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30">● LIVE 24/7</span>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 mt-4">
        
        <!-- Video Player Section -->
        <div class="lg:col-span-2 bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex flex-col">
            <div class="aspect-video bg-black flex items-center justify-center relative">
                <video id="video-player" class="w-full h-full" controls autoplay></video>
                <div id="placeholder-text" class="absolute text-slate-500 animate-pulse pointer-events-none">Select a channel to start streaming...</div>
            </div>
            <div class="p-4">
                <h2 id="channel-title" class="text-lg font-semibold">Channel Name</h2>
                <p id="channel-status" class="text-xs text-slate-400 mt-1">Status: High Definition • Secure Stream</p>
            </div>
        </div>

        <!-- Channel List Sidebar -->
        <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 flex flex-col h-[550px]">
            <input type="text" id="search-box" placeholder="🔍 চ্যানেল খুঁজুন..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 mb-4">
            
            <div id="channel-list" class="overflow-y-auto space-y-2 pr-1 flex-1">
                
                <!-- Live Channel 106 (Newly Added) -->
                <button onclick="playStream('https://1nyaler.streamhostingcdn.top/stream/106/index.m3u8', 'Live Channel 106')" class="channel-btn w-full flex items-center justify-between p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/60 rounded-xl transition-all group">
                    <span class="font-medium text-sm group-hover:text-red-400">🔴 Live Channel 106</span>
                    <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">HD</span>
                </button>

                <!-- T Sports -->
                <button onclick="playStream('https://198.195.239.50:8095/tsports/tracks-v1a1/mono.m3u8', 'T Sports')" class="channel-btn w-full flex items-center justify-between p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/60 rounded-xl transition-all group">
                    <span class="font-medium text-sm group-hover:text-red-400">🏏 T Sports</span>
                    <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">HD</span>
                </button>

                <!-- Real Madrid TV -->
                <button onclick="playStream('https://rmtv.akamaized.net/hls/live/2043154/rmtv-en-web/master.m3u8', 'Real Madrid TV (English)')" class="channel-btn w-full flex items-center justify-between p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/60 rounded-xl transition-all group">
                    <span class="font-medium text-sm group-hover:text-red-400">⚽ Real Madrid TV</span>
                    <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">1080p</span>
                </button>

                <!-- Willow Sports -->
                <button onclick="playStream('https://d36r8jifhgsk5j.cloudfront.net/Willow_TV.m3u8', 'Willow Sports')" class="channel-btn w-full flex items-center justify-between p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/60 rounded-xl transition-all group">
                    <span class="font-medium text-sm group-hover:text-red-400">🏏 Willow Sports</span>
                    <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">HD</span>
                </button>

                <!-- FIFA World Cup 2026 -->
                <button onclick="playStream('https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/1702-audio_113322_eng=113200-video=2202800.m3u8', 'FIFA World Cup 2026')" class="channel-btn w-full flex items-center justify-between p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/60 rounded-xl transition-all group">
                    <span class="font-medium text-sm group-hover:text-red-400">🏆 FIFA World Cup 2026</span>
                    <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">HD</span>
                </button>

                <!-- Red Bull TV Brasil -->
                <button onclick="playStream('https://d03ae6b5c6724c24867e97a3dc04934a.mediatailor.us-west-2.amazonaws.com/v1/master/ba62fe743df0fe93366eba3a257d792884136c7f/LINEAR-1026-WORBBRPTFAST-WHALETVPLUS/1026/hls/master/playlist.m3u8', 'Red Bull TV Brasil')" class="channel-btn w-full flex items-center justify-between p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/60 rounded-xl transition-all group">
                    <span class="font-medium text-sm group-hover:text-red-400">⚡ Red Bull TV Brasil</span>
                    <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">HD</span>
                </button>

                <!-- RS Sports 1 -->
                <button onclick="playStream('https://video07.logicahost.com.br/rssports01/rssports01/playlist.m3u8', 'RS Sports 1')" class="channel-btn w-full flex items-center justify-between p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/60 rounded-xl transition-all group">
                    <span class="font-medium text-sm group-hover:text-red-400">📺 RS Sports 1</span>
                    <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">Live</span>
                </button>

            </div>
        </div>

    </main>

    <!-- JavaScript for HLS Player and Search -->
    <script>
        const video = document.getElementById('video-player');
        const placeholder = document.getElementById('placeholder-text');
        const channelTitle = document.getElementById('channel-title');
        const channelStatus = document.getElementById('channel-status');
        let hls = null;

        function playStream(url, name) {
            placeholder.style.display = 'none';
            channelTitle.innerText = name;
            channelStatus.innerText = 'Status: Connecting to Live Stream...';

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                    channelStatus.innerText = 'Status: Playing Live (HD)';
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        channelStatus.innerText = 'Status: Stream Error or Link Expired!';
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                    channelStatus.innerText = 'Status: Playing Live (HD)';
                });
            }
        }

        // Search Filter Feature
        document.getElementById('search-box').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => {
                const text = btn.innerText.toLowerCase();
                btn.style.display = text.includes(term) ? 'flex' : 'none';
            });
        });
    </script>

</body>
</html>
