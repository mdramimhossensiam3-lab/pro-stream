<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Stream - Live TV & IPTV</title>
    <!-- HLS.js for m3u8 streaming support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        header h1 {
            font-size: 1.5rem;
            color: #00ffcc;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background-color: #1a1a1a;
            border-right: 1px solid #333;
            overflow-y: auto;
            padding: 10px;
        }
        .channel-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: #2a2a2a;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-item:hover {
            background-color: #3a3a3a;
        }
        .channel-item.active {
            background-color: #00ffcc;
            color: #121212;
            font-weight: bold;
        }
        .player-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000;
            padding: 20px;
        }
        video {
            width: 100%;
            max-height: 80vh;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .now-playing {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #aaa;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 40vh;
            }
            .player-area {
                height: 60vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Pro Stream - Live TV</h1>
    </header>

    <div class="container">
        <div class="sidebar" id="channelList">
            <!-- Channel list will be loaded dynamically -->
        </div>

        <div class="player-area">
            <video id="videoPlayer" controls autoplay></video>
            <div class="now-playing" id="nowPlayingText">চ্যানেল সিলেক্ট করুন</div>
        </div>
    </div>

    <script>
        // আপনার প্লেলিস্টের কার্যকরী সিলেকশন ডেটা
        const playlistData = [
            { name: "Bioscope Plus 🇧🇩", url: "https://bioscope.sm-monirulislam-exp.workers.dev/bioscope.m3u8" },
            { name: "BTV World", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1709/output/index.m3u8" },
            { name: "BTV Sangsad", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1713/output/index.m3u8" },
            { name: "ATN BANGLA", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1722/output/index.m3u8" },
            { name: "ATN NEWS", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1706/output/index.m3u8" },
            { name: "CHANNEL 24", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1703/output/index.m3u8" },
            { name: "CHANNEL I", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1723/output/index.m3u8" },
            { name: "EKATTOR TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1705/output/index.m3u8" },
            { name: "INDEPENDENT TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1704/output/index.m3u8" },
            { name: "JAMUNA TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1701/output/index.m3u8" },
            { name: "NTV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1716/output/index.m3u8" },
            { name: "SOMOY TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/index.m3u8" },
            { name: "DEEPTO TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1711/output/index.m3u8" },
            { name: "RAJDHANI TV", url: "https://sm-monirul.top/toffee/play/rajdhani_tv.m3u8" },
            { name: "Bein Sports 1", url: "https://cdn-uw2-prod.tsv2.amagi.tv/linear/amg02873-kravemedia-mtrspt1-distrotv/playlist.m3u8" },
            { name: "Bein Sport Xtra", url: "https://amg01334-beinsportsllc-beinxtra-localnow-kcy6r.amagi.tv/playlist.m3u8" },
            { name: "Caze TV BR", url: "https://dfr80qz435crc.cloudfront.net/MNOP/Amagi/Caze/Caze_TV_BR/Caze_TV.m3u8" },
            { name: "REAL MADRID TV", url: "https://rmtv.akamaized.net/hls/live/2043153/rmtv-es-web/bitrate_3.m3u8" },
            { name: "IDMANTV 🇹🇷", url: "https://str2.yodacdn.net/idman_300_to_small/tracks-v1a1/mono.m3u8" },
            { name: "Quran", url: "https://vodzong.mjunoon.tv:8087/streamtest/SaudiQuran-142/playlist.m3u8" },
            { name: "SUNNAH", url: "http://m.live.net.sa:1935/live/sunnah/chunklist.m3u8" },
            { name: "Redbull TV", url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master_3360.m3u8" },
            { name: "Willow Sports (1080p)", url: "https://d36r8jifhgsk5j.cloudfront.net/Willow_TV.m3u8" }
        ];

        const listContainer = document.getElementById('channelList');
        const video = document.getElementById('videoPlayer');
        const nowPlayingText = document.getElementById('nowPlayingText');
        let hls;

        function loadChannels() {
            playlistData.forEach((channel, index) => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerText = channel.name;
                div.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    playStream(channel.url, channel.name);
                };
                listContainer.appendChild(div);
            });

            // ডিফল্টভাবে প্রথম চ্যানেলটি প্লে করা
            if(playlistData.length > 0) {
                listContainer.children[0].classList.add('active');
                playStream(playlistData[0].url, playlistData[0].name);
            }
        }

        function playStream(url, name) {
            nowPlayingText.innerText = `প্লে হচ্ছে: ${name}`;
            
            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            }
        }

        loadChannels();
    </script>
</body>
</html>
