<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live TV Hub - Ultra HD</title>
    <!-- Clappr Player CSS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            margin: 0;
            font-size: 28px;
            color: var(--accent-color);
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        #player-container {
            width: 100%;
            height: 450px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .custom-input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .custom-input-box input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: var(--card-bg);
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .custom-input-box button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .custom-input-box button:hover {
            opacity: 0.9;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        .channel-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .channel-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.2);
        }
        .channel-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 8px;
            border-radius: 6px;
        }
        .channel-card span {
            display: block;
            font-size: 14px;
            font-weight: 600;
        }
        @media(max-width: 600px) {
            #player-container { height: 250px; }
            .channels-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Pro Live TV Hub</h1>
        <p style="color: #94a3b8; font-size: 14px;">লাইভ স্পোর্টস এবং টিভি চ্যানেল উপভোগ করুন</p>
    </header>

    <!-- Video Player -->
    <div id="player-container"></div>

    <!-- Custom Link Input -->
    <div class="custom-input-box">
        <input type="text" id="customUrl" placeholder="আপনার নিজস্ব .m3u8 বা .ts লিংক এখানে পেস্ট করুন...">
        <button onclick="playCustomStream()">চালু করুন</button>
    </div>

    <!-- Channel List with Images -->
    <div class="channels-grid">
        <div class="channel-card" onclick="playStream('https://rmtv.akamaized.net/hls/live/2043153/rmtv-es-web/master.m3u8', 'Real Madrid TV')">
            <img src="https://img.icons8.com/color/96/real-madrid.png" alt="Real Madrid TV">
            <span>Real Madrid TV</span>
        </div>
        <div class="channel-card" onclick="playStream('https://str2.yodacdn.net/idman_300_to_small/tracks-v1a1/mono.m3u8', 'Idman TV')">
            <img src="https://img.icons8.com/color/96/tv.png" alt="Idman TV">
            <span>Idman TV 🇹🇷</span>
        </div>
        <div class="channel-card" onclick="playStream('https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master_3360.m3u8', 'Red Bull TV')">
            <img src="https://img.icons8.com/color/96/energy-drink.png" alt="Red Bull TV">
            <span>Red Bull TV</span>
        </div>
        <div class="channel-card" onclick="playStream('https://owrcovcrpy.gpcdn.net/bpk-tv/1709/output/index.m3u8', 'BTV')">
            <img src="https://img.icons8.com/color/96/bangladesh.png" alt="BTV">
            <span>বাংলাদেশ টেলিভিশন</span>
        </div>
        <div class="channel-card" onclick="playStream('http://116.204.149.16/mytv/index.m3u8', 'My TV')">
            <img src="https://img.icons8.com/color/96/video-playlist.png" alt="My TV">
            <span>মাই টিভি (My TV)</span>
        </div>
        <div class="channel-card" onclick="playStream('https://dazn-combat-rakuten.amagi.tv/hls/amagi_hls_data_rakutenAA-dazn-combat-rakuten/CDN/master.m3u8', 'DAZN Combat')">
            <img src="https://img.icons8.com/color/96/boxing.png" alt="DAZN Combat">
            <span>DAZN Combat</span>
        </div>
        <div class="channel-card" onclick="playStream('https://cdn-uw2-prod.tsv2.amagi.tv/linear/amg01074-fueltv-fueltvemeaen-sportstribal/playlist.m3u8', 'Fuel TV')">
            <img src="https://img.icons8.com/color/96/race-car.png" alt="Fuel TV">
            <span>Fuel TV</span>
        </div>
    </div>
</div>

<script>
    let player;

    function playStream(url, title) {
        if (player) {
            player.destroy();
        }
        player = new Clappr.Player({
            source: url,
            parentId: "#player-container",
            autoPlay: true,
            height: "100%",
            width: "100%",
            plugins: [],
        });
    }

    function playCustomStream() {
        const url = document.getElementById('customUrl').value.trim();
        if (url) {
            playStream(url, 'Custom Stream');
        } else {
            alert('দয়া করে একটি সঠিক লিংক দিন!');
        }
    }

    // ডিফল্টভাবে প্রথম চ্যানেলটি প্লে হবে
    window.onload = function() {
        playStream('https://rmtv.akamaized.net/hls/live/2043153/rmtv-es-web/master.m3u8', 'Real Madrid TV');
    };
</script>

</body>
</html>
